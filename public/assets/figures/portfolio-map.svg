  <text x="400" y="195" class="text-center-sub">Computational Neuroscience Hub</text>

  <!-- Left Top: Research -->
  <rect x="50" y="45" width="220" height="70" class="node-box" />
  <text x="70" y="73" class="text-node-title">Research Areas</text>
  <text x="70" y="93" class="text-node-sub">EEG, Temporal Cognition &amp; Bayes</text>

