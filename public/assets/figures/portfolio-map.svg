<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" aria-label="Peiman Jannatipour Research Portfolio Knowledge Map">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .center-box { fill: #0284c7; stroke: #38bdf8; stroke-width: 2; rx: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
      .node-box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .text-center-title { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .text-center-sub { fill: #e0f2fe; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-node-title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .text-node-sub { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .line { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4 2; opacity: 0.7; }
    </style>
  </defs>

  <rect width="800" height="360" class="bg" />

  <!-- Connecting Lines -->
  <line x1="400" y1="180" x2="160" y2="80" class="line" />
  <line x1="400" y1="180" x2="640" y2="80" class="line" />
  <line x1="400" y1="180" x2="160" y2="180" class="line" />
  <line x1="400" y1="180" x2="640" y2="180" class="line" />
  <line x1="400" y1="180" x2="160" y2="280" class="line" />
  <line x1="400" y1="180" x2="640" y2="280" class="line" />

