<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 330" role="img" aria-labelledby="t d"><title id="t">NeuroLab OS architecture</title><desc id="d">Electron desktop shell connects to a local FastAPI engine, ingestion, preprocessing and quality control, model fitting, in silico interventions, provenance, and reporting.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><style>.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.h{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#475569}.e{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect class="b" x="20" y="110" rx="18" width="180" height="90"/><text class="h" x="110" y="145" text-anchor="middle">Electron desktop</text><text class="s" x="110" y="172" text-anchor="middle">local UI shell</text><rect class="b" x="250" y="110" rx="18" width="190" height="90"/><text class="h" x="345" y="145" text-anchor="middle">FastAPI engine</text><text class="s" x="345" y="172" text-anchor="middle">loopback session API</text><rect class="b" x="490" y="110" rx="18" width="190" height="90"/><text class="h" x="585" y="145" text-anchor="middle">Ingestion</text><text class="s" x="585" y="172" text-anchor="middle">EEG · ROI/BOLD</text><rect class="b" x="730" y="110" rx="18" width="190" height="90"/><text class="h" x="825" y="145" text-anchor="middle">Preprocess + QC</text><text class="s" x="825" y="172" text-anchor="middle">reviewable artifacts</text><rect class="b" x="970" y="45" rx="18" width="210" height="90"/><text class="h" x="1075" y="80" text-anchor="middle">Model execution</text><text class="s" x="1075" y="107" text-anchor="middle">seeded fitting</text><rect class="b" x="970" y="180" rx="18" width="210" height="90"/><text class="h" x="1075" y="215" text-anchor="middle">In silico intervention</text><text class="s" x="1075" y="242" text-anchor="middle">native / proxy-labelled</text><rect class="b" x="1230" y="110" rx="18" width="220" height="90"/><text class="h" x="1340" y="145" text-anchor="middle">Provenance + report</text><text class="s" x="1340" y="172" text-anchor="middle">manifests · hashes · bundle</text><path class="e" d="M200 155H250"/><path class="e" d="M440 155H490"/><path class="e" d="M680 155H730"/><path class="e" d="M920 140L970 105"/><path class="e" d="M920 170L970 215"/><path class="e" d="M1180 90L1230 140"/><path class="e" d="M1180 225L1230 170"/></svg>