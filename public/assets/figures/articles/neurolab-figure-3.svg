<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Verification is not scientific validation</title>
  <desc id="desc">Four-layer evidence hierarchy distinguishing artifact and build integrity, software-contract verification, numerical sanity and synthetic recovery, and external scientific validation.</desc>
  <rect width="1500" height="700" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Verification is not scientific validation</text>
  <text x="70" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Each evidence layer answers a different question; lower layers do not imply higher layers.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="155" width="1360" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="155" width="8" height="105" rx="4" fill="#d97706"/>
    <text x="105" y="194" font-size="28" font-weight="700" fill="#d97706">4</text>
    <text x="155" y="194" font-size="22" font-weight="700" fill="#0f172a">External scientific validation</text>
    <text x="155" y="226" font-size="15" fill="#64748b">Reference implementation · public EEG/ROI-BOLD concordance · cross-machine reproduction</text>
    <rect x="1195" y="180" width="190" height="44" rx="12" fill="#fff7ed"/>
    <text x="1290" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">OUTSTANDING</text>

    <rect x="70" y="285" width="1360" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="285" width="8" height="105" rx="4" fill="#2563eb"/>
    <text x="105" y="324" font-size="28" font-weight="700" fill="#2563eb">3</text>
    <text x="155" y="324" font-size="22" font-weight="700" fill="#0f172a">Numerical sanity + synthetic recovery</text>
    <text x="155" y="356" font-size="15" fill="#64748b">Oscillator/OU checks · parameter recovery · intervention consistency</text>
    <rect x="1195" y="310" width="190" height="44" rx="12" fill="#eff6ff"/>
    <text x="1290" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">INTERNAL COVERAGE</text>

    <rect x="70" y="415" width="1360" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="415" width="8" height="105" rx="4" fill="#059669"/>
    <text x="105" y="454" font-size="28" font-weight="700" fill="#059669">2</text>
    <text x="155" y="454" font-size="22" font-weight="700" fill="#0f172a">Software-contract verification</text>
    <text x="155" y="486" font-size="15" fill="#64748b">82 backend tests · 38 workflow tests · model-detail/registry checks</text>
    <rect x="1195" y="440" width="190" height="44" rx="12" fill="#ecfdf5"/>
    <text x="1290" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">DEMONSTRATED</text>

    <rect x="70" y="545" width="1360" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="545" width="8" height="105" rx="4" fill="#059669"/>
    <text x="105" y="584" font-size="28" font-weight="700" fill="#059669">1</text>
    <text x="155" y="584" font-size="22" font-weight="700" fill="#0f172a">Artifact + build integrity</text>
    <text x="155" y="616" font-size="15" fill="#64748b">Manifest/SHA agreement · engine build · packaged application startup</text>
    <rect x="1195" y="570" width="190" height="44" rx="12" fill="#ecfdf5"/>
    <text x="1290" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">DEMONSTRATED</text>
  </g>
</svg>