<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="t d"><title id="t">NeuroLab OS executable model inventory</title><desc id="d">Model registry grouped into population and neural mass, oscillator, state-space and stochastic, and ROI/BOLD-oriented families.</desc><style>.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.r{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2}.h{font:700 17px Arial;fill:#0f172a}.s{font:13px Arial;fill:#475569}.l{stroke:#94a3b8;stroke-width:2}</style><rect class="r" x="525" y="20" rx="18" width="350" height="72"/><text class="h" x="700" y="52" text-anchor="middle">Executable model registry</text><text class="s" x="700" y="75" text-anchor="middle">11 computational model families</text><line class="l" x1="700" y1="92" x2="700" y2="125"/><line class="l" x1="170" y1="125" x2="1230" y2="125"/><g><rect class="b" x="40" y="145" rx="16" width="260" height="70"/><text class="h" x="170" y="175" text-anchor="middle">Population / neural-mass</text><text class="s" x="170" y="198" text-anchor="middle">Wilson-Cowan · Jansen-Rit · RWW-lite</text><line class="l" x1="170" y1="125" x2="170" y2="145"/></g><g><rect class="b" x="370" y="145" rx="16" width="260" height="70"/><text class="h" x="500" y="175" text-anchor="middle">Oscillator models</text><text class="s" x="500" y="198" text-anchor="middle">Kuramoto · Stuart-Landau · Hopf</text><line class="l" x1="500" y1="125" x2="500" y2="145"/></g><g><rect class="b" x="700" y="145" rx="16" width="300" height="70"/><text class="h" x="850" y="175" text-anchor="middle">State-space / stochastic</text><text class="s" x="850" y="198" text-anchor="middle">linear SS · OU · VAR · switching SS</text><line class="l" x1="850" y1="125" x2="850" y2="145"/></g><g><rect class="b" x="1070" y="145" rx="16" width="260" height="70"/><text class="h" x="1200" y="175" text-anchor="middle">ROI / BOLD-oriented</text><text class="s" x="1200" y="198" text-anchor="middle">fMRI latent-state</text><line class="l" x1="1200" y1="125" x2="1200" y2="145"/></g><rect x="260" y="285" rx="18" width="880" height="92" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="h" x="700" y="320" text-anchor="middle">Interpretation boundary</text><text class="s" x="700" y="348" text-anchor="middle">Executable computational implementations are not, by themselves, evidence of biological or clinical validation.</text></svg>