<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-labelledby="t d"><title id="t">NeuroLab OS workflow</title><desc id="d">Project ingest, standardized metadata, preprocessing and QC, model review, seeded fitting, optional in silico intervention, and provenance-aware reporting.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><style>.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.h{font:700 17px Arial;fill:#0f172a}.s{font:13px Arial;fill:#475569}.e{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><g transform="translate(15 85)"><rect class="b" rx="16" width="165" height="90"/><text class="h" x="82.5" y="34" text-anchor="middle">Project ingest</text><text class="s" x="82.5" y="60" text-anchor="middle">dataset + session</text></g><g transform="translate(210 85)"><rect class="b" rx="16" width="185" height="90"/><text class="h" x="92.5" y="34" text-anchor="middle">Metadata + hash</text><text class="s" x="92.5" y="60" text-anchor="middle">standardized manifest</text></g><g transform="translate(425 85)"><rect class="b" rx="16" width="185" height="90"/><text class="h" x="92.5" y="34" text-anchor="middle">Preprocess + QC</text><text class="s" x="92.5" y="60" text-anchor="middle">review status</text></g><g transform="translate(640 85)"><rect class="b" rx="16" width="185" height="90"/><text class="h" x="92.5" y="34" text-anchor="middle">Model contract</text><text class="s" x="92.5" y="60" text-anchor="middle">scientist review</text></g><g transform="translate(855 85)"><rect class="b" rx="16" width="185" height="90"/><text class="h" x="92.5" y="34" text-anchor="middle">Seeded fitting</text><text class="s" x="92.5" y="60" text-anchor="middle">diagnostics + simulation</text></g><g transform="translate(1070 25)"><rect class="b" rx="16" width="210" height="90"/><text class="h" x="105" y="34" text-anchor="middle">In silico intervention</text><text class="s" x="105" y="60" text-anchor="middle">optional target search</text></g><g transform="translate(1070 150)"><rect class="b" rx="16" width="210" height="90"/><text class="h" x="105" y="34" text-anchor="middle">Report generation</text><text class="s" x="105" y="60" text-anchor="middle">figures + methods</text></g><g transform="translate(1310 85)"><rect class="b" rx="16" width="260" height="90"/><text class="h" x="130" y="34" text-anchor="middle">Provenance-aware bundle</text><text class="s" x="130" y="60" text-anchor="middle">narrative · manifests · lineage</text></g><path class="e" d="M180 130H210"/><path class="e" d="M395 130H425"/><path class="e" d="M610 130H640"/><path class="e" d="M825 130H855"/><path class="e" d="M1040 115L1070 80"/><path class="e" d="M1040 145L1070 195"/><path class="e" d="M1280 70L1310 115"/><path class="e" d="M1280 195L1310 145"/></svg>